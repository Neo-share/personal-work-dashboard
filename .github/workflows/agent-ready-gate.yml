name: agent-ready-gate

on:
  pull_request:
    branches:
      - main

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detect scope
        id: scope
        run: |
          json="$(node ops/agent-ci-scope.mjs --base=origin/main --head=HEAD)"
          echo "$json"
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$json" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Scope check
        env:
          SCOPE_JSON: ${{ steps.scope.outputs.json }}
        run: |
          scope="$(node -e 'console.log(JSON.parse(process.env.SCOPE_JSON).scope)')"
          pnpm "agent:scope:${scope}"

      - run: pnpm gate:pr
