schema_version: 1
kind: subdomain_tasks
domain: shared
scope: shared
paths:
  - shared/
tasks:
  - id: shared-task-001-type-change
    title: 修改共享领域类型
    owner_scope: shared
    risk_level: high
    inputs:
      - shared/AGENTS.md
      - shared/src/types.ts
    outputs:
      - shared/src/types.ts
    verify:
      - "pnpm agent:scope:shared"
      - "pnpm --filter @project-manager/shared build"
      - "pnpm agent:gate:dev"
    rollback:
      - "git checkout -- shared/"
    approval:
      required: true
      reason: "共享类型是前后端契约，需要同步调用方"
